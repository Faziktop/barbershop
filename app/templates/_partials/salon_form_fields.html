{# Общие поля формы салона. Ожидает: salon (может быть None), regions #}
<div class="mb-3">
  <label class="form-label">Название</label>
  <input type="text" name="name" class="form-control"
         value="{{ salon.name if salon else '' }}" required>
</div>

<div class="mb-3">
  <label class="form-label">Город</label>
  <select name="city_id" class="form-select">
    <option value="">— не указан —</option>
    {% for r in regions %}
      <optgroup label="{{ r.name }}">
        {% for c in r.cities %}
          <option value="{{ c.id }}"
            {% if salon and salon.city_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </optgroup>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Адрес</label>
  <input type="text" name="address" class="form-control"
         value="{{ salon.address if salon else '' }}" required>
</div>

<div class="mb-3">
  <label class="form-label">Телефон</label>
  <input type="text" name="phone" class="form-control"
         value="{{ salon.phone if salon else '' }}">
</div>

<div class="row">
  <div class="col-6 mb-3">
    <label class="form-label">Широта</label>
    <input type="text" name="latitude" class="form-control"
           value="{{ salon.latitude if salon else '' }}" placeholder="55.7558">
  </div>
  <div class="col-6 mb-3">
    <label class="form-label">Долгота</label>
    <input type="text" name="longitude" class="form-control"
           value="{{ salon.longitude if salon else '' }}" placeholder="37.6173">
  </div>
</div>

<div class="mb-3">
  <label class="form-label">Ссылка на обложку (необязательно)</label>
  <input type="text" name="photo_url" class="form-control"
         value="{{ salon.photo_url if salon else '' }}"
         placeholder="https://... или оставьте пустым">
  <div class="form-text text-light-50">
    Если не указывать — обложкой станет первое загруженное фото.
  </div>
</div>

<div class="mb-3">
  <label class="form-label">Загрузить фотографии</label>
  <input type="file" name="photos" class="form-control"
         multiple accept="image/png,image/jpeg,image/webp,image/gif">
  <div class="form-text text-light-50">
    Можно выбрать несколько сразу. Максимум 20 МБ на файл.
  </div>
</div>

<div class="mb-3">
  <label class="form-label">Описание</label>
  <textarea name="description" class="form-control"
            rows="3">{{ salon.description if salon else '' }}</textarea>
</div>
